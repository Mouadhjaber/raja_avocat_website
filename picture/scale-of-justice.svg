<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Base -->
  <rect x="45" y="85" width="10" height="10" fill="#C5A55A"/>
  
  <!-- Pole -->
  <rect x="48" y="20" width="4" height="65" fill="#C5A55A"/>
  
  <!-- Top beam -->
  <rect x="15" y="18" width="70" height="4" rx="2" fill="#C5A55A"/>
  
  <!-- Left chain -->
  <line x1="20" y1="22" x2="15" y2="45" stroke="#C5A55A" stroke-width="2"/>
  
  <!-- Right chain -->
  <line x1="80" y1="22" x2="85" y2="45" stroke="#C5A55A" stroke-width="2"/>
  
  <!-- Left pan -->
  <path d="M5 45 Q15 55 25 45" stroke="#C5A55A" stroke-width="2" fill="none"/>
  <ellipse cx="15" cy="47" rx="12" ry="3" fill="#C5A55A"/>
  
  <!-- Right pan -->
  <path d="M75 45 Q85 55 95 45" stroke="#C5A55A" stroke-width="2" fill="none"/>
  <ellipse cx="85" cy="47" rx="12" ry="3" fill="#C5A55A"/>
  
  <!-- Top decoration -->
  <circle cx="50" cy="15" r="5" fill="#C5A55A"/>
</svg>